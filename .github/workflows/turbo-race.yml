name: Turbo Legends race engine tests
on:
  push:
    paths:
      - 'games/turbo-legends/**'
      - '.github/workflows/turbo-race.yml'
  pull_request:
    paths:
      - 'games/turbo-legends/**'
  workflow_dispatch:
jobs:
  racing-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run race simulation regression suite
        run: node --test games/turbo-legends/tests/race-engine.test.cjs
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start local test server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/turbo-http.log 2>&1 &
          sleep 2
      - name: Run browser smoke test
        run: node games/turbo-legends/tests/browser-smoke.cjs
