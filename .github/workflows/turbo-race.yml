name: Turbo Legends race engine tests
on:
  push:
    paths:
      - 'games/turbo-legends/**'
      - '.github/workflows/turbo-race.yml'
  pull_request:
    paths:
      - 'games/turbo-legends/**'
  workflow_dispatch:
jobs:
  racing-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run race simulation regression suite
        run: node --test games/turbo-legends/tests/race-engine.test.cjs
